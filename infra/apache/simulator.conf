# Installato sul server in: /etc/apache2/conf-available/simulator.conf
# Abilitazione:  sudo a2enconf simulator && sudo apache2ctl configtest && sudo systemctl reload apache2
#

# La radice del dominio porta al simulatore.
RedirectMatch 302 ^/$ /simulator/

# Le route di Angular (/simulator/dlx, /simulator/rv32i, /simulator/about, ...)
# non corrispondono a file reali: senza questo fallback, ricaricare la pagina darebbe 404.
# I file esistenti (JS, CSS, immagini, PDF, script .dlx) vengono serviti normalmente.
<Directory /var/www/html/simulator>
    FallbackResource /simulator/index.html
</Directory>
