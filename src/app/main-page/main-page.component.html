<mat-sidenav-container class="container">
  <mat-sidenav #sidenav class="mat-elevation-z4"
               [mode]="sidebarMode()"
               [opened]="sidebarOpened()"
               (openedChange)="sidebarOpened.set($event)">
    <app-documentation/>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="main">
      <div class="left">
        <app-editor
          [registers]="registers()"
          (wasContentModified)="contentModified.set($event)"
        />

<!--   TODO: temporarily disabled due implementation bugs     -->
        <!--<button mat-raised-button class="mr" (click)="toggleDiagrams()">
          @if (this.diagramsOpened()) {
            <span class="btn">Hide Waves Form <i class="fas fa-wave-square"></i></span>
          } @else {
            <span class="btn">Show Waves Form <i class="fas fa-wave-square"></i></span>
          }
        </button>-->

        <app-memory />
      </div>

      <div class="right">
        @if (this.diagramsOpened()) {
          <app-diagram [registers]="registers()" />
        }
        <app-registers [registers]="registers()"/>
      </div>
    </div>

    <div class="mobile-warning">
      <mat-icon>desktop_windows</mat-icon>
      <h2>Dispositivo non supportato</h2>
      <p>L'editor e il simulatore richiedono uno schermo più grande. Apri l'applicazione da un PC o da un tablet.</p>
      <p>È comunque possibile consultare la documentazione</p>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
